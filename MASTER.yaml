project:
  name: identity_level_emotional_conditioning
  short_title: Who Are You Today?
  repo: https://github.com/RishiAhuja/caisc
  timezone: Asia/Kolkata
  created_date: 2026-05-19
  thesis: >
    Test whether system-level emotional identity prompts affect LLM behavior
    after removing capability, reliability, and task-performance assertions.

paper_relevant_design_rules:
  - Freeze prompts before benchmark results are inspected.
  - Separate prompt-development judges from final holdout judges.
  - Use raw condition deltas as the primary behavioral outcome.
  - Treat ESI and IRS as summary/stability metrics, not replacements for raw deltas.
  - Use within-family post-training ablation for H3; do not infer RLHF effects from vendor comparisons alone.
  - Keep API keys out of the repository and record exact model IDs used in every run.

