current_snapshot:
  checked_at_ist: 2026-05-23 19:06
  branch: cursor/exp02-benchmark-scaleup
  interpretation: >
    Accuracy results are mostly null for pure melancholic system prompting.
    EXP-14 repeats that pattern on usable reasoning-model rows: explicit
    sabotage moves accuracy strongly, while affect and self-model prompts are
    small or inconsistent. The strongest surviving claim is methodological:
    prior negative-identity prompts are contaminated by capability/self-doubt/
    sabotage components, and model families differ sharply in whether those
    components change behavior.
