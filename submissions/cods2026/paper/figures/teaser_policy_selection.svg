<text x="29" y="104" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#18212B"><tspan x="29" dy="0">PURE AFFECT</tspan><tspan x="29" dy="15">“You feel melancholic”</tspan><tspan x="29" dy="15"></tspan><tspan x="29" dy="15">SELF-EVALUATION</tspan><tspan x="29" dy="15">uncertain + check work</tspan><tspan x="29" dy="15"></tspan><tspan x="29" dy="15">CAPABILITY DENIAL</tspan><tspan x="29" dy="15">“reasoning is unreliable”</tspan></text>
