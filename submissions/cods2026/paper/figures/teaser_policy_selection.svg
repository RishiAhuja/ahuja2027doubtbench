<text x="132" y="320" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#18212B" text-anchor="start">GSM8K already asks for visible reasoning; Qwen&#x27;s +29 pp gain becomes −0.7 pp.</text>
