<text x="314" y="144" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#18212B"><tspan x="314" dy="0">Same task, different</tspan><tspan x="314" dy="15">model and instruction</tspan><tspan x="314" dy="15">context can elicit</tspan><tspan x="314" dy="15">different behaviors.</tspan></text>
