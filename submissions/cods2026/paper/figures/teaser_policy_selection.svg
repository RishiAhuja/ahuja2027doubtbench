<text x="589" y="69" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#18212B"><tspan x="589" dy="0">self-evaluation +29.2 pp; direct checking +37.4 pp</tspan></text>
