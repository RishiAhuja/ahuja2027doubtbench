<line x1="500" y1="170" x2="568" y2="65" stroke="#65717E" stroke-width="1.35" marker-end="url(#arrow)"/>
<line x1="500" y1="170" x2="568" y2="175" stroke="#65717E" stroke-width="1.35" marker-end="url(#arrow)"/>
